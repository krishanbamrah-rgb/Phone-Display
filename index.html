<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
  #pic { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
</style>
</head>
<body>
<img id="pic" alt="">
<script>
(function () {
  var pic = document.getElementById('pic');
  var shown = null, cfg = null, timer = null, idx = 0, timerKey = '';

  function show(name) {
    var s = 'images/' + encodeURIComponent(name) + '?v=' + (cfg.version || 1);
    if (s !== shown) { shown = s; pic.src = s; }
  }
  function indexOf(name) {
    for (var i = 0; i < cfg.images.length; i++) if (cfg.images[i] === name) return i;
    return 0;
  }
  function apply() {
    if (!cfg || !cfg.images || !cfg.images.length) return;
    if (cfg.mode === 'cycle') {
      var key = 'c' + cfg.interval + ':' + cfg.images.length;
      if (timerKey !== key) {
        if (timer) clearInterval(timer);
        timerKey = key;
        idx = indexOf(cfg.image);
        timer = setInterval(function () {
          idx = (idx + 1) % cfg.images.length;
          show(cfg.images[idx]);
        }, Math.max(3, cfg.interval || 10) * 1000);
      }
      if (idx >= cfg.images.length) idx = 0;
      show(cfg.images[idx]);
    } else {
      if (timer) { clearInterval(timer); timer = null; }
      timerKey = '';
      idx = indexOf(cfg.image);
      show(cfg.images[idx]);
    }
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', 'config.json?t=' + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState === 4 && x.status === 200) {
        try { cfg = JSON.parse(x.responseText); apply(); } catch (e) {}
      }
    };
    x.send();
  }
  poll();
  setInterval(poll, 20000);
})();
</script>
</body>
</html>
